<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <h1>The Image Tag</h1>
    <p><img> tag is used to add images in an HTML page.</p>
    <h2>For Example</h2>
    <img src="https://mastdp.in/wp-content/uploads/beautiful-lotus-dp-image.webp" alt="Lotus Image">
    <!-- Image Dimensions -->
    We can set the width and height of an image using the width and height attributes.
    <img src="https://mastdp.in/wp-content/uploads/beautiful-lotus-dp-image.webp" alt="Lotus Image" height="300" width="250">
    <!-- Displaying a Local Image -->
    <br>
    To display a local image in HTML, use the <img> tag and provide the image file path in the src attribute.
    <img src="images.jpg" alt="Rose Image">
</body>
</html>
