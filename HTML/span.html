<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span Tag</title>
</head>
<body>
    <h1>The Span Tag</h1>
    <p>The <span> tag is an inline container, meaning it only takes up as much width as necessary.</p>
    <p>This is a <span>highlighted</span> word in a sentence.</p>
    <h2>For Example</h2>
    <p>I love <span>web development</span>.</p>
    The span tag is used to style or group a small part of text without starting a new line.
</body>
</html>
