<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hr Tag</title>
</head>
<body>
    <h1>Hr Tag</h1>
    <p><hr> tag in HTML is used to create a horizontal ruler often used to separate the content.</p>
    <hr>
    <h2>For Example</h2>
    <h2>About Me</h2>
    <p>I am a web development student.</p>
    <hr>
    <h2>My Skills</h2>
    <p>HTML and CSS</p>
    The hr tag creates a horizontal line that separates different sections of a webpage.
</body>
</html>
