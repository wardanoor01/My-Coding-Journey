<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bold Tag</title>
</head>
<body>
    <h1>Bold Tag</h1>
    <p>We can use bold tag to highlight the text as follows:</p>
    <b>This is bold</b>
    <h2>For Example</h2>
    <p>This is a <b>bold</b> word.</p>
    The bold tag makes the text bold without adding any special importance or meaning.
</body>
</html>
